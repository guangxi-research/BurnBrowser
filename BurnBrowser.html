<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>客户端性能测试</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #score-board {
            opacity: 0.6;
            background: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            padding: 32px;
            border: none;
        }

        .score-display {
            display: flex;
            justify-content: space-around;
            margin: 24px 0;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

            .score-circle svg {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                transform: rotate(-90deg);
            }

        .ring-bg {
            fill: none;
            stroke: #222;
            stroke-width: 4px;
        }

        .ring-progress {
            fill: none;
            stroke-width: 4px;
            stroke-linecap: round;
            stroke-dasharray: 364.4;
            stroke-dashoffset: 364.4;
            transition: none;
        }

        /* 控制动画触发和复位 */
        #main-container.is-active .ring-progress {
            stroke-dashoffset: var(--offset);
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .score-val {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            z-index: 1;
        }

        .score-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            z-index: 1;
        }

        #info-list {
            margin: 0;
            padding: 0;
        }

            #info-list div {
                display: flex;
                justify-content: space-between;
                margin: 22px 0px 22px 0px;
            }

            #info-list dt {
                font-size: 12px;
                color: #bbb;
                margin: 0;
            }

            #info-list dd {
                margin: 0;
                color: #fff;
                font-size: 12px;
                font-weight: 500;
                text-align: right;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-width: 280px;
            }
    </style>
</head>
<body id="main-container">
    <canvas id="glCanvas"></canvas>
    <div id="fpsCounter" style="position:fixed; top:10px; left:10px; color:white; font-size:16px; font-family:Arial; padding:5px;">FPS:0</div>
    <button id="switchBtn" style="position:absolute;right:10px;top:10px;">改变背景</button>

    <script id="vs" type="x-shader/x-vertex">
        #version 300 es
        in vec4 position;
        void main() { gl_Position = position; }
    </script>

    <script id="terrain_fs" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;
        uniform vec3 iResolution;
        uniform float iTime;
        out vec4 fragColor;

        void mainImage(out vec4 o, vec2 u) {
            float i = 0.0, s = 0.0, d = 0.0, n = 0.0;
            vec3 Z = vec3(0.0), p;
            vec3 res = iResolution;
            u = (u + u - res.xy) / res.y;
            u.y -= 0.3;
            o = vec4(0.0);

            for(int j = 0; j < 40; j++) {
                i = float(j);
                s = 0.4 * min(3.0 - s, 0.01 + 0.3 * abs(s));
                d += s;
                float sunDist = max(length(u - vec2(0.4, 0.25)), 0.02);
                o += s + 0.005 * vec4(6, 2, 1, 0) / sunDist + 0.5 * (1.0 + cos(0.4 * i + iTime * 0.4 + vec4(2, 1, 0, 0))) * s;
                p = vec3(u * d, d - iTime * 0.2);
                s = 3.0 - p.y - cos(p.x * 0.3) * 0.5;
                n = 0.01;
                for(int k = 0; k < 4; k++) {
                    s -= abs(dot(sin(0.23 * p / n), Z + n));
                    n *= 2.0;
                }
            }

            o = tanh(o * o / 30.0 / exp(d / 5.0));
            o.a = 1.0;
        }

        void main() {
            mainImage(fragColor, gl_FragCoord.xy);
        }
    </script>

    <script id="ocean_fs" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;

        uniform vec3 iResolution;
        uniform float iTime;
        out vec4 fragColor;

        const int NUM_STEPS = 32;
        const float PI      = 3.14159265;
        const float EPSILON = 1e-3;
        #define EPSILON_NRM (0.1 / iResolution.x)

        const int ITER_GEOMETRY = 3;
        const int ITER_FRAGMENT = 5;
        const float SEA_HEIGHT = 0.6;
        const float SEA_CHOPPY = 4.0;
        const float SEA_SPEED = 0.8;
        const float SEA_FREQ = 0.16;
        const vec3 SEA_BASE = vec3(0.0, 0.09, 0.18);
        const vec3 SEA_WATER_COLOR = vec3(0.8, 0.9, 0.6) * 0.6;
        #define SEA_TIME (1.0 + iTime * SEA_SPEED)
        const mat2 octave_m = mat2(1.6, 1.2, -1.2, 1.6);

        mat3 fromEuler(vec3 ang) {
            vec2 a1 = vec2(sin(ang.x), cos(ang.x));
            vec2 a2 = vec2(sin(ang.y), cos(ang.y));
            vec2 a3 = vec2(sin(ang.z), cos(ang.z));
            mat3 m;
            m[0] = vec3(a1.y * a3.y + a1.x * a2.x * a3.x, a1.y * a2.x * a3.x + a3.y * a1.x, -a2.y * a3.x);
            m[1] = vec3(-a2.y * a1.x, a1.y * a2.y, a2.x);
            m[2] = vec3(a3.y * a1.x * a2.x + a1.y * a3.x, a1.x * a3.x - a1.y * a3.y * a2.x, a2.y * a3.y);
            return m;
        }

        float hash(vec2 p) {
            float h = dot(p, vec2(127.1, 311.7));
            return fract(sin(h) * 43758.5453123);
        }

        float noise(in vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return -1.0 + 2.0 * mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                                    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }

        float diffuse(vec3 n, vec3 l, float p) {
            return pow(dot(n, l) * 0.4 + 0.6, p);
        }

        float specular(vec3 n, vec3 l, vec3 e, float s) {
            float nrm = (s + 8.0) / (PI * 8.0);
            return pow(max(dot(reflect(e, n), l), 0.0), s) * nrm;
        }

        vec3 getSkyColor(vec3 e) {
            e.y = (max(e.y, 0.0) * 0.8 + 0.2) * 0.8;
            return vec3(pow(1.0 - e.y, 2.0), 1.0 - e.y, 0.6 + (1.0 - e.y) * 0.4) * 1.1;
        }

        float sea_octave(vec2 uv, float choppy) {
            uv += noise(uv);
            vec2 wv = 1.0 - abs(sin(uv));
            vec2 swv = abs(cos(uv));
            wv = mix(wv, swv, wv);
            return pow(1.0 - pow(wv.x * wv.y, 0.65), choppy);
        }

        float map(vec3 p) {
            float freq = SEA_FREQ;
            float amp = SEA_HEIGHT;
            float choppy = SEA_CHOPPY;
            vec2 uv = p.xz; uv.x *= 0.75;
            float d, h = 0.0;
            for(int i = 0; i < ITER_GEOMETRY; i++) {
                d = sea_octave((uv + SEA_TIME) * freq, choppy);
                d += sea_octave((uv - SEA_TIME) * freq, choppy);
                h += d * amp;
                uv *= octave_m; freq *= 1.9; amp *= 0.22;
                choppy = mix(choppy, 1.0, 0.2);
            }
            return p.y - h;
        }

        float map_detailed(vec3 p) {
            float freq = SEA_FREQ;
            float amp = SEA_HEIGHT;
            float choppy = SEA_CHOPPY;
            vec2 uv = p.xz; uv.x *= 0.75;
            float d, h = 0.0;
            for(int i = 0; i < ITER_FRAGMENT; i++) {
                d = sea_octave((uv + SEA_TIME) * freq, choppy);
                d += sea_octave((uv - SEA_TIME) * freq, choppy);
                h += d * amp;
                uv *= octave_m; freq *= 1.9; amp *= 0.22;
                choppy = mix(choppy, 1.0, 0.2);
            }
            return p.y - h;
        }

        vec3 getSeaColor(vec3 p, vec3 n, vec3 l, vec3 eye, vec3 dist) {
            float fresnel = clamp(1.0 - dot(n, -eye), 0.0, 1.0);
            fresnel = min(fresnel * fresnel * fresnel, 0.5);
            vec3 reflected = getSkyColor(reflect(eye, n));
            vec3 refracted = SEA_BASE + diffuse(n, l, 80.0) * SEA_WATER_COLOR * 0.12;
            vec3 color = mix(refracted, reflected, fresnel);
            float atten = max(1.0 - dot(dist, dist) * 0.001, 0.0);
            color += SEA_WATER_COLOR * (p.y - SEA_HEIGHT) * 0.18 * atten;
            color += specular(n, l, eye, 600.0 * inversesqrt(dot(dist, dist)));
            return color;
        }

        vec3 getNormal(vec3 p, float eps) {
            vec3 n;
            n.y = map_detailed(p);
            n.x = map_detailed(vec3(p.x + eps, p.y, p.z)) - n.y;
            n.z = map_detailed(vec3(p.x, p.y, p.z + eps)) - n.y;
            n.y = eps;
            return normalize(n);
        }

        float heightMapTracing(vec3 ori, vec3 dir, out vec3 p) {
            float tm = 0.0, tx = 1000.0;
            float hx = map(ori + dir * tx);
            if(hx > 0.0) { p = ori + dir * tx; return tx; }
            float hm = map(ori);
            for(int i = 0; i < NUM_STEPS; i++) {
                float tmid = mix(tm, tx, hm / (hm - hx));
                p = ori + dir * tmid;
                float hmid = map(p);
                if(hmid < 0.0) { tx = tmid; hx = hmid; }
                else { tm = tmid; hm = hmid; }
                if(abs(hmid) < EPSILON) break;
            }
            return mix(tm, tx, hm / (hm - hx));
        }

        vec3 getPixel(in vec2 coord, float time) {
            vec2 uv = coord / iResolution.xy;
            uv = uv * 2.0 - 1.0;
            uv.x *= iResolution.x / iResolution.y;

            vec3 ang = vec3(0.0, 0.0, 0.0);
            vec3 ori = vec3(0.0, 3.5, time * 2.0);
            vec3 dir = normalize(vec3(uv.x, uv.y - 0.3, -2.0));
            dir.z += length(uv) * 0.14;
            dir = normalize(dir) * fromEuler(ang);

            vec3 p;
            heightMapTracing(ori, dir, p);
            vec3 dist = p - ori;
            vec3 n = getNormal(p, dot(dist, dist) * EPSILON_NRM);
            vec3 light = normalize(vec3(0.0, 1.0, 0.8));

            vec3 sceneColor = mix(
                getSkyColor(dir),
                getSeaColor(p, n, light, dir, dist),
                pow(smoothstep(0.0, -0.02, dir.y), 0.2)
            );

            vec2 sunUV = (coord + coord - iResolution.xy) / iResolution.y;
            vec2 sunPos = vec2(0.4, 0.55);
            float sunDist = max(length(sunUV - sunPos), 0.01);

            vec3 sunColor = vec3(1.0, 0.9, 0.7);
            vec3 sunGlow = 0.012 * sunColor / sunDist;
            sunGlow += 0.02 * sunColor * pow(max(0.0, 1.0 - sunDist), 8.0);

            return sceneColor + sunGlow;
        }

        void main() {
            vec3 color = getPixel(gl_FragCoord.xy, iTime);
            fragColor = vec4(pow(color, vec3(0.65)), 1.0);
        }
    </script>

    <script id="desert_fs" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;

        uniform vec3 iResolution;
        uniform float iTime;
        out vec4 fragColor;

        #define FAR 80.
        mat2 rot2(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
        float hash(vec3 p) { return fract(sin(dot(p, vec3(21.71, 157.97, 113.43))) * 45758.5453); }

        vec2 hash22(vec2 p) {
            float n = sin(dot(p, vec2(113, 1)));
            return fract(vec2(2097152, 262144) * n) * 2. - 1.;
        }

        float n2D(vec2 p) {
            vec2 i = floor(p); p -= i;
            p *= p * (3. - p * 2.);
            return dot(mat2(fract(sin(mod(vec4(0, 1, 113, 114) + dot(i, vec2(1, 113)), 6.2831853)) * 43758.5453)) * vec2(1. - p.y, p.y), vec2(1. - p.x, p.x));
        }

        float gradN2D(vec2 f) {
            vec2 p = floor(f); f -= p;
            vec2 w = f * f * (3. - 2. * f);
            vec2 e = vec2(0, 1);
            float c = mix(mix(dot(hash22(p + e.xx), f - e.xx), dot(hash22(p + e.yx), f - e.yx), w.x),
                            mix(dot(hash22(p + e.xy), f - e.xy), dot(hash22(p + e.yy), f - e.yy), w.x), w.y);
            return c * .5 + .5;
        }

        float fBm(vec2 p) {
            return gradN2D(p) * .57 + gradN2D(p * 2.) * .28 + gradN2D(p * 4.) * .15;
        }

        float noise3D(vec3 p) {
            const vec3 s = vec3(113, 157, 1);
            vec3 ip = floor(p); p -= ip;
            vec4 h = vec4(0., s.yz, s.y + s.z) + dot(ip, s);
            p = p * p * (3. - 2. * p);
            h = mix(fract(sin(h) * 43758.5453), fract(sin(h + s.x) * 43758.5453), p.x);
            h.xy = mix(h.xz, h.yw, p.y);
            return mix(h.x, h.y, p.z);
        }

        float gT;

        float grad(float x, float offs) {
            x = abs(fract(x / 6.283 + offs - .25) - .5) * 2.;
            return mix(smoothstep(0., 1., x), clamp(x * x * (-1. + 2. * x), 0., 1.), .15);
        }

        float sandL(vec2 p) {
            vec2 q = rot2(3.14159 / 18.) * p;
            q.y += (gradN2D(q * 18.) - .5) * .05;
            float g1 = grad(q.y * 80., 0.);
            q = rot2(-3.14159 / 20.) * p;
            q.y += (gradN2D(q * 12.) - .5) * .05;
            float g2 = grad(q.y * 80., .5);
            q = rot2(3.14159 / 4.) * p;
            float a2 = dot(sin(q * 12. - cos(q.yx * 12.)), vec2(.25)) + .5;
            return 1. - (1. - g1 * (1. - a2)) * (1. - g2 * a2);
        }

        float sand(vec2 p) {
            p = vec2(p.y - p.x, p.x + p.y) * .7071 / 4.;
            float c1 = sandL(p);
            float c2 = sandL(rot2(3.14159 / 12.) * p * 1.25);
            c1 = mix(c1, c2, smoothstep(.1, .9, gradN2D(p * vec2(4))));
            return c1 / (1. + gT * gT * .015);
        }

        vec2 path(float z) { return vec2(4. * sin(z * .1), 0); }

        float surfFunc(vec3 p) {
            p /= 2.5;
            float l1 = smoothstep(0., 1.05, n2D(p.xz * .2) * 2. - .5);
            float l2 = smoothstep(.2, 1., pow(1. - abs(n2D(p.xz * .275) - .5) * 2., 2.));
            return l1 * .7 + l2 * .25 + n2D(p.xz * 1.5) * .05;
        }

        float camSurfFunc(vec3 p) {
            p /= 2.5;
            float l1 = smoothstep(0., 1.05, n2D(p.xz * .2) * 2. - .5);
            float l2 = smoothstep(.2, 1., pow(1. - abs(n2D(p.xz * .275) - .5) * 2., 2.));
            return (l1 * .7 + l2 * .25) / .95;
        }

        float map(vec3 p) {
            return p.y + (.5 - surfFunc(p)) * 2.;
        }

        float bumpSurf3D(vec3 p) {
            float n = surfFunc(p);
            float nx = surfFunc(p + vec3(.001, 0, 0));
            float nz = surfFunc(p + vec3(0, 0, .001));
            return sand(p.xz + vec2(n - nx, n - nz) * 1000.);
        }

        vec3 doBumpMap(vec3 p, vec3 nor, float bf) {
            const vec2 e = vec2(0.001, 0);
            float ref = bumpSurf3D(p);
            vec3 grad = (vec3(bumpSurf3D(p - e.xyy), bumpSurf3D(p - e.yxy), bumpSurf3D(p - e.yyx)) - ref) / e.x;
            grad -= nor * dot(nor, grad);
            return normalize(nor + grad * bf);
        }

        float trace(vec3 ro, vec3 rd) {
            float t = 0., h;
            for(int i = 0; i < 96; i++) {
                h = map(ro + rd * t);
                if(abs(h) < .001 * (t * .125 + 1.) || t > FAR) break;
                t += h;
            }
            return min(t, FAR);
        }

        vec3 getNormal(vec3 p, float ef) {
            float sgn = 1.;
            vec3 e = vec3(.001 * ef, 0, 0), mp = vec3(0);
            for(int i = 0; i < 6; i++) {
                mp.x += map(p + sgn * e) * sgn;
                sgn = -sgn;
                if((i & 1) == 1) { mp = mp.yzx; e = e.zxy; }
            }
            return normalize(mp);
        }

        vec3 getSky(vec3 rd, vec3 ld) {
            vec3 sky = mix(vec3(.8, .7, .5), vec3(.4, .6, .9), pow(max(rd.y + .15, 0.), .5)) * vec3(.84, 1, 1.17);
            return sky;
        }

        float getMist(vec3 ro, vec3 rd, vec3 lp, float t) {
            float mist = 0., t0 = 0.;
            for (int i = 0; i < 24; i++) {
                if (t0 > t) break;
                float sAtt = 1. / (1. + length(lp - ro) / FAR * .25);
                float c = noise3D((ro + rd * t0) * 2.5);
                mist += c * sAtt;
                t0 += clamp(c * .25, .1, 1.);
            }
            return max(mist / 48., 0.);
        }

        void mainImage(out vec4 fragColor, vec2 fragCoord) {
            vec2 u = (fragCoord - iResolution.xy * .5) / iResolution.y;
            u.y -= 0.1;

            vec3 ro = vec3(0, 1.2, iTime * 0.5);
            vec3 lookAt = ro + vec3(0, -.05, .5);
            ro.xy += path(ro.z);
            lookAt.xy += path(lookAt.z);

            float sfH = camSurfFunc(ro), sfH2 = camSurfFunc(lookAt);
            ro.y += sfH2; lookAt.y += sfH2;
            float slope = (sfH2 - sfH) / length(lookAt - ro);

            vec3 forward = normalize(lookAt - ro);
            vec3 right = normalize(vec3(forward.z, 0, -forward.x));
            vec3 up = cross(forward, right);
            vec3 rd = normalize(forward + 1.2 * u.x * right + 1.2 * u.y * up);
            rd.xy = rot2(path(lookAt.z).x / 96.) * rd.xy;
            rd.yz = rot2(-slope / 3.) * rd.yz;

            float t = trace(ro, rd);
            gT = t;
            vec3 sp = ro + t * rd;
            vec3 lp = vec3(FAR * .25, FAR * .25, FAR) + vec3(0, 0, ro.z);
            vec3 ld = normalize(lp - sp);
            vec3 col = vec3(0);

            if (t < FAR) {
                vec3 sn = doBumpMap(sp, getNormal(sp, 1.), .07);
                float dif = max(dot(ld, sn), 0.);
                float spe = pow(max(dot(reflect(-ld, sn), -rd), 0.), 5.);
                float fre = clamp(1. + dot(rd, sn), 0., 1.);
                float atten = 1. / (1. + pow(length(lp - sp) / FAR, 2.) * .025);

                col = mix(vec3(1, .95, .7), vec3(.9, .6, .4), fBm(sp.xz * 16.));
                col *= bumpSurf3D(sp) * .75 + .5;
                col = mix(col * .7 + hash(floor(sp * 96.)) * .2, col, min(t * t / FAR, 1.));
                col = col * (dif + .2 + vec3(1, .97, .92) * spe * 2.) * atten;
                col += getSky(reflect(rd, sn), ld) * fre * .15;
            }

            vec3 sky = getSky(rd, normalize(lp - vec3(0, 0, ro.z)));
            col = mix(col, sky, smoothstep(0., .95, t / FAR));

            vec2 sunUV = (fragCoord + fragCoord - iResolution.xy) / iResolution.y;
            vec2 sunPos = vec2(0.4, 0.55);
            float sunDist = max(length(sunUV - sunPos), 0.01);

            vec3 sunColor = vec3(1.0, 0.9, 0.7);
            vec3 sunGlow = 0.012 * sunColor / sunDist;
            sunGlow += 0.02 * sunColor * pow(max(0.0, 1.0 - sunDist), 8.0);
            col += sunGlow;

            float mist = getMist(ro, rd, lp, t);
            col = col * .75 + (col + .25) * vec3(1, .95, .9) * mist * 1.5;

            vec2 uv = fragCoord / iResolution.xy;
            col *= pow(16. * uv.x * uv.y * (1. - uv.x) * (1. - uv.y), .0625);
            fragColor = vec4(sqrt(clamp(col, 0., 1.)), 1);
        }

        void main() {
            mainImage(fragColor, gl_FragCoord.xy);
        }
    </script>

    <script id="grass_fs" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;
        uniform vec3 iResolution;
        uniform float iTime;
        out vec4 fragColor;

        #define THRESHOLD .003
        #define MOD2 vec2(3.07965, 7.4235)

        vec3 sunLight = normalize(vec3(0.35, 0.2, 0.3));
        vec3 sunColour = vec3(1.0, .75, .6);

        float Hash(float p) {
            vec2 p2 = fract(vec2(p) / MOD2);
            p2 += dot(p2.yx, p2.xy + 19.19);
            return fract(p2.x * p2.y);
        }

        float Hash(vec2 p) {
            p = fract(p / MOD2);
            p += dot(p.xy, p.yx + 19.19);
            return fract(p.x * p.y);
        }

        float Noise(in vec2 x) {
            vec2 p = floor(x);
            vec2 f = fract(x);
            f = f * f * (3.0 - 2.0 * f);
            float n = p.x + p.y * 57.0;
            float res = mix(mix(Hash(n + 0.0), Hash(n + 1.0), f.x),
                            mix(Hash(n + 57.0), Hash(n + 58.0), f.x), f.y);
            return res;
        }

        vec2 hash22(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.xx + p3.yz) * p3.zy);
        }

        vec2 Voronoi(in vec2 x) {
            vec2 p = floor(x);
            vec2 f = fract(x);
            float res = 100.0;
            vec2 id;
            for (int j = -1; j <= 1; j++)
                for (int i = -1; i <= 1; i++) {
                    vec2 b = vec2(float(i), float(j));
                    vec2 r = b - f + hash22(p + b);
                    float d = dot(r, r);
                    if (d < res) {
                        res = d;
                        id.x = Hash(p + b);
                    }
                }
            return vec2(max(.4 - sqrt(res), 0.0), id.x);
        }

        vec2 Terrain(in vec2 p) {
            vec2 pos = p * 0.003;
            float w = 50.0;
            float f = .0;
            for (int i = 0; i < 3; i++) {
                f += Noise(pos) * w;
                w = w * 0.62;
                pos *= 2.5;
            }
            return vec2(f, 0.0);
        }

        vec2 Map(in vec3 p) {
            vec2 h = Terrain(p.xz);
            return vec2(p.y - h.x, h.y);
        }

        float FractalNoise(in vec2 xy) {
            float w = .7;
            float f = 0.0;
            for (int i = 0; i < 3; i++) {
                f += Noise(xy) * w;
                w = w * 0.6;
                xy = 2.0 * xy;
            }
            return f;
        }

        vec3 GetSky(in vec3 rd) {
            float v = pow(1.0 - max(rd.y, 0.0), 6.);
            vec3 sky = mix(vec3(.1, .2, .3), vec3(.32, .32, .32), v);
            return clamp(sky, 0.0, 1.0);
        }

        vec3 ApplyFog(in vec3 rgb, in float dis, in vec3 dir) {
            float fogAmount = clamp(dis * dis * 0.0000012, 0.0, 1.0);
            return mix(rgb, GetSky(dir), fogAmount);
        }

        vec3 DE(vec3 p) {
            float base = Terrain(p.xz).x - 1.9;
            float height = Noise(p.xz * 2.0) * .75 + Noise(p.xz) * .35 + Noise(p.xz * .5) * .2;
            float y = p.y - base - height;
            y = y * y;
            vec2 ret = Voronoi((p.xz * 2.5 + sin(y * 2.0 + p.zx * 12.3) * .12 + vec2(sin(iTime * 1.3 + 1.5 * p.z), sin(iTime * 2.6 + 1.5 * p.x)) * y * .5));
            float f = ret.x * .65 + y * .5;
            return vec3(y - f * 1.4, clamp(f * 1.1, 0.0, 1.0), ret.y);
        }

        float CircleOfConfusion(float t) {
            return max(t * .04, (2.0 / iResolution.y) * (1.0 + t));
        }

        float Linstep(float a, float b, float t) {
            return clamp((t - a) / (b - a), 0., 1.);
        }

        vec3 GrassBlades(in vec3 rO, in vec3 rD, in vec3 mat, in float dist) {
            float d = 0.0;
            float rCoC = CircleOfConfusion(dist * .3);
            vec4 col = vec4(mat * 0.15, 0.0);
            for (int i = 0; i < 15; i++) {
                if (col.w > .99) break;
                vec3 p = rO + rD * d;
                vec3 ret = DE(p);
                ret.x += .5 * rCoC;
                if (ret.x < rCoC) {
                    float alpha = (1.0 - col.y) * Linstep(-rCoC, rCoC, -ret.x);
                    vec3 gra = mix(mat, vec3(.35, .35, min(pow(ret.z, 4.0) * 35.0, .35)), pow(ret.y, 9.0) * .7) * ret.y;
                    col += vec4(gra * alpha, alpha);
                }
                d += max(ret.x * .7, .1);
            }
            if (col.w < .2) col.xyz = vec3(0.1, .15, 0.05);
            return col.xyz;
        }

        void DoLighting(inout vec3 mat, in vec3 pos, in vec3 normal, in vec3 eyeDir, in float dis) {
            float h = dot(sunLight, normal);
            mat = mat * sunColour * (max(h, 0.0) + .2);
        }

        vec3 TerrainColour(vec3 pos, vec3 dir, vec3 normal, float dis, float type) {
            vec3 mat = mix(vec3(.0, .3, .0), vec3(.2, .3, .0), Noise(pos.xz * .025));
            float t = FractalNoise(pos.xz * .1) + .5;
            mat = GrassBlades(pos, dir, mat, dis) * t;
            DoLighting(mat, pos, normal, dir, dis);
            return ApplyFog(mat, dis, dir);
        }

        float BinarySubdivision(in vec3 rO, in vec3 rD, float t, float oldT) {
            float halfwayT = 0.0;
            for (int n = 0; n < 5; n++) {
                halfwayT = (oldT + t) * .5;
                float h = Map(rO + halfwayT * rD).x;
                (h < THRESHOLD) ? t = halfwayT : oldT = halfwayT;
            }
            return t;
        }

        bool Scene(in vec3 rO, in vec3 rD, out float resT, out float type) {
            float t = 5.;
            float oldT = 0.0;
            float h = 0.0;
            bool hit = false;
            for (int j = 0; j < 60; j++) {
                vec3 p = rO + t * rD;
                h = Map(p).x;
                if (h < THRESHOLD) {
                    hit = true;
                    break;
                }
                oldT = t;
                t += h + (t * 0.04);
            }
            type = 0.0;
            resT = BinarySubdivision(rO, rD, t, oldT);
            return hit;
        }

        vec3 PostEffects(vec3 rgb, vec2 xy) {
            rgb = pow(rgb, vec3(0.45));
            #define CONTRAST 1.1
            #define SATURATION 1.3
            #define BRIGHTNESS 1.3
            rgb = mix(vec3(.5), mix(vec3(dot(vec3(.2125, .7154, .0721), rgb * BRIGHTNESS)), rgb * BRIGHTNESS, SATURATION), CONTRAST);
            rgb *= .4 + 0.5 * pow(40.0 * xy.x * xy.y * (1.0 - xy.x) * (1.0 - xy.y), 0.2);
            return rgb;
        }

        void mainImage(out vec4 o, vec2 u) {
            vec2 xy = u / iResolution.xy;
            vec2 uv = (-1.0 + 2.0 * xy) * vec2(iResolution.x / iResolution.y, 1.0);

            vec3 cameraPos = vec3(0.0, 34.0, iTime * 8.0);
            cameraPos.y += Terrain(cameraPos.xz).x;

            // 自然俯视目标点，代替直接砍 UV
            vec3 camTar = cameraPos + vec3(0.0, -0.8, 4.0);

            vec3 cw = normalize(camTar - cameraPos);
            vec3 cp = vec3(0.0, 1.0, 0.0); // 绝对水平无侧倾
            vec3 cu = normalize(cross(cw, cp));
            vec3 cv = normalize(cross(cu, cw));
            vec3 dir = normalize(uv.x * cu + uv.y * cv + 1.2 * cw);

            vec3 col;
            float dist, type;
            bool isHit = Scene(cameraPos, dir, dist, type);

            if (!isHit) {
                col = GetSky(dir);
            } else {
                vec3 pos = cameraPos + dist * dir;
                vec2 p = vec2(0.1, 0.0);
                vec3 nor = vec3(0.0, Terrain(pos.xz).x, 0.0);
                vec3 v2 = nor - vec3(p.x, Terrain(pos.xz + p).x, 0.0);
                vec3 v3 = nor - vec3(0.0, Terrain(pos.xz - p.yx).x, -p.x);
                nor = normalize(cross(v2, v3));
                col = TerrainColour(pos, dir, nor, dist, type);
            }

            // 计算太阳
            vec2 sunUV = (u * 2.0 - iResolution.xy) / iResolution.y;
            vec2 sunPos = vec2(0.4, 0.65); // 确保挂在天上
            float sunDist = max(length(sunUV - sunPos), 0.01);
            vec3 sCol = vec3(1.0, 0.9, 0.7);
            vec3 sunGlow = 0.012 * sCol / sunDist;
            sunGlow += 0.02 * sCol * pow(max(0.0, 1.0 - sunDist), 8.0);

            // 如果光线打中地面，削弱太阳光晕防止"画在地上"
            if (isHit) {
                col += sunGlow * 0.1;
            } else {
                col += sunGlow;
            }

            o = vec4(PostEffects(col, xy), 1.0);
        }

        void main() {
            mainImage(fragColor, gl_FragCoord.xy);
        }
    </script>

    <script id="moutain_fs" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;

        uniform vec3 iResolution;
        uniform float iTime;
        out vec4 fragColor;

        const int NUM_STEPS = 64;
        const float PI = 3.14159265;
        const float EPSILON = 1e-3;
        #define EPS_NRM (0.1 / iResolution.x)

        const int ITER_GEOMETRY = 7;
        const int ITER_FRAGMENT = 10;
        const float TERR_HEIGHT = 12.0;
        const float TERR_WARP = 0.7;
        const float TERR_OCTAVE_AMP = 0.58;
        const float TERR_OCTAVE_FREQ = 2.5;
        const float TERR_MULTIFRACT = 0.27;
        const float TERR_CHOPPY = 1.9;
        const float TERR_FREQ = 0.24;
        const vec2 TERR_OFFSET = vec2(13.5, 15.0);

        const vec3 SKY_COLOR = vec3(0.5, 0.59, 0.75) * 0.6;
        const vec3 SUN_COLOR = vec3(1.0, 1.0, 0.98) * 0.7;
        const vec3 COLOR_SNOW = vec3(1.0, 1.0, 1.1) * 2.2;
        const vec3 COLOR_ROCK = vec3(0.05, 0.05, 0.1);

        // --- 常用函数 ---
        mat3 fromEuler(vec3 ang) {
            vec2 a1 = vec2(sin(ang.x), cos(ang.x));
            vec2 a2 = vec2(sin(ang.y), cos(ang.y));
            vec2 a3 = vec2(sin(ang.z), cos(ang.z));
            mat3 m;
            m[0] = vec3(a1.y * a3.y + a1.x * a2.x * a3.x, a1.y * a2.x * a3.x + a3.y * a1.x, -a2.y * a3.x);
            m[1] = vec3(-a2.y * a1.x, a1.y * a2.y, a2.x);
            m[2] = vec3(a3.y * a1.x * a2.x + a1.y * a3.x, a1.x * a3.x - a1.y * a3.y * a2.x, a2.y * a3.y);
            return m;
        }

        float hash(vec2 p) {
            float h = dot(p, vec2(127.1, 311.7));
            return fract(sin(h) * 43758.5453123);
        }

        float hash3(vec3 p) {
            return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
        }

        vec3 noise_deriv(in vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            float a = hash(i + vec2(0.0, 0.0));
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            float h1 = mix(a, b, u.x);
            float h2 = mix(c, d, u.x);
            return vec3(abs(mix(h1, h2, u.y)), 6.0 * f * (1.0 - f) * (vec2(b - a, c - a) + (a - b - c + d) * u.yx));
        }

        // --- 地形核心 ---
        vec3 octave(vec2 uv) {
            vec3 n = noise_deriv(uv);
            return vec3(pow(n.x, TERR_CHOPPY), n.y, n.z);
        }

        float map(vec3 p) {
            float frq = TERR_FREQ;
            float amp = 1.0;
            vec2 uv = p.xz * frq + TERR_OFFSET;
            vec2 dsum = vec2(0.0);
            float h = 0.0;
            for(int i = 0; i < ITER_GEOMETRY; i++) {
                vec3 n = octave((uv - dsum * TERR_WARP) * frq);
                h += n.x * amp;
                dsum += n.yz * (n.x * 2.0 - 1.0) * amp;
                frq *= TERR_OCTAVE_FREQ;
                amp *= TERR_OCTAVE_AMP * pow(n.x, TERR_MULTIFRACT);
            }
            h *= TERR_HEIGHT / (1.0 + dot(p.xz, p.xz) * 1e-3);
            return p.y - h;
        }

        float map_detailed(vec3 p) {
            float frq = TERR_FREQ;
            float amp = 1.0;
            vec2 uv = p.xz * frq + TERR_OFFSET;
            vec2 dsum = vec2(0.0);
            float h = 0.0;
            for(int i = 0; i < ITER_FRAGMENT; i++) {
                vec3 n = octave((uv - dsum * TERR_WARP) * frq);
                h += n.x * amp;
                dsum += n.yz * (n.x * 2.0 - 1.0) * amp;
                frq *= TERR_OCTAVE_FREQ;
                amp *= TERR_OCTAVE_AMP * pow(n.x, TERR_MULTIFRACT);
            }
            h *= TERR_HEIGHT / (1.0 + dot(p.xz, p.xz) * 1e-3);
            return p.y - h;
        }

        vec3 getNormal(vec3 p, float eps) {
            vec3 n;
            n.y = map_detailed(p);
            n.x = map_detailed(vec3(p.x + eps, p.y, p.z)) - n.y;
            n.z = map_detailed(vec3(p.x, p.y, p.z + eps)) - n.y;
            n.y = eps;
            return normalize(n);
        }

        // --- 渲染逻辑 ---
        vec3 getSkyColor(vec3 e) {
            e.y = max(e.y, 0.0);
            return vec3(pow(1.0 - e.y, 3.0), pow(1.0 - e.y, 1.2), 0.8 + (1.0 - e.y) * 0.3);
        }

        void mainImage(out vec4 fragColor, vec2 fragCoord) {
            vec2 uv = (fragCoord * 2.0 - iResolution.xy) / iResolution.y;
            float time = iTime * 0.1;

            // 相机路径与姿态
            vec3 ang = vec3(0.1 * sin(time * 3.0), 0.1, -time);
            vec3 ori = vec3(0.0, 5.0, time * 20.0);
            vec3 dir = normalize(vec3(uv.x, uv.y - 0.1, -2.0));
            dir.z += length(uv) * 0.12;
            dir = normalize(dir) * fromEuler(ang);

            // 使相机高度自适应地形
            ori.y -= map(ori) - 4.0;

            // 步进追踪
            vec3 p = ori;
            float t = 0.0;
            float d = 0.0;
            for(int i = 0; i < NUM_STEPS; i++) {
                p = ori + dir * t;
                d = map(p);
                if(d < 0.01) break;
                t += d * 0.6;
            }

            // 着色
            vec3 lightDir = normalize(vec3(1.0, 1.0, -0.3));
            vec3 col;
            vec3 dist = p - ori;

            if(d < 0.1) {
                vec3 n = getNormal(p, dot(dist, dist) * EPS_NRM);
                float slope = 1.0 - n.y;

                // 地形混色：岩石与雪
                vec3 terrCol = mix(COLOR_SNOW, COLOR_ROCK, smoothstep(0.0, 0.2, slope * slope));
                terrCol = mix(terrCol, COLOR_SNOW, clamp(smoothstep(0.6, 0.8, slope + (p.y - TERR_HEIGHT * 0.5) * 0.05), 0.0, 1.0));

                // 光照
                float diff = pow(max(dot(n, lightDir), 0.0), 2.0);
                col = terrCol * (SKY_COLOR + diff * SUN_COLOR);

                // 雾气
                vec3 fog = getSkyColor(vec3(dir.x, 0.0, dir.z));
                col = mix(col, fog, clamp(min(length(dist) * 0.015, dot(p.xz - ori.xz, p.xz - ori.xz) * 0.0005), 0.0, 1.0));
            } else {
                col = getSkyColor(dir);
            }

            // 统一太阳光晕
            vec2 sunUV = (fragCoord * 2.0 - iResolution.xy) / iResolution.y;
            vec2 sunPos = vec2(0.4, 0.55); // 对应其他shader的太阳位置
            float sDist = max(length(sunUV - sunPos), 0.01);
            vec3 sunGlow = 0.012 * vec3(1.0, 0.9, 0.7) / sDist;
            sunGlow += 0.02 * vec3(1.0, 0.9, 0.7) * pow(max(0.0, 1.0 - sDist), 8.0);
            col += sunGlow;

            // 后处理
            col = pow(col * 0.8, vec3(1.0 / 2.2));
            fragColor = vec4(col, 1.0);
        }

        void main() {
            mainImage(fragColor, gl_FragCoord.xy);
        }
    </script>

    <script id="cloud_fs" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;

        uniform vec3 iResolution;
        uniform float iTime;
        out vec4 fragColor;

        #define T iTime
        #define R(a) mat2(cos(a+vec4(0,33,11,0)))
        #define N normalize

        float tri(in float x){return abs(fract(x)-.5);}
        vec3 tri3(in vec3 p){return vec3( tri(p.z+tri(p.y*1.)), tri(p.z+tri(p.x*1.)), tri(p.y+tri(p.x*1.)));}

        float triNoise3d(vec3 p)
        {
            p.z += T/4e1;
            float z=1.5;
            float rz = 0.;
            vec3 bp = p;
            mat2 m2 = R(.3);
            for (float i=0.; i<=3.; i++ )
            {
                vec3 dg = tri3(bp*2.)*1.;
                p += (dg+T/3e1);

                bp *= 2.;
                z *= 1.75;
                p *= 1.1;
                p.yz*= m2;

                rz+= (tri(p.z+tri(p.x+tri(p.y))))/z;
                bp += .2;
            }
            return rz;
        }

        void mainImage(out vec4 o, vec2 u) {
            float a = 0.0, i = 0.0, s = 0.0, d = 0.0;
            vec3  p = iResolution;

            u = (u + u - p.xy) / p.y;
            u.y -= 0.3;
            vec3 D = N(vec3(u, 2.0));
            o = vec4(0.0);
            float edgeDist = 0.01;
            float sunDist = 0.02;

            for(; i++<1e2;
                d += s = .1+.4*abs(s),
                o += 6.*(1.+cos(T/2.+.1*i+vec4(5,4,3,0)))/s
                  +  .5*vec4(1,2,4,0)/max(abs(1.01+u.y-cos(u.x/5.3)), edgeDist)
                  +  4.*vec4(6,2,1,0)/max(length(u - vec2(0.4, 0.25)), sunDist)
            )
            p = D*d,
            p.y+=2.5,
            //s = 6. - abs(p.y-cos(p.x/3e1)*4.),
            //s -= 7.*triNoise3d(p/3e1);
            s = p.y + 1.0 - cos(p.x/3e1)*4.,
            s += 7.*triNoise3d(p/3e1);

            vec4 expVal = min(1e2*vec4(5,2,1,0)/d/d, vec4(88.0));
            o = tanh(o/5e3 * exp(expVal));
        }

        void main() {
            mainImage(fragColor, gl_FragCoord.xy);
        }
    </script>

    <script id="fire_fs" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;

        uniform vec3 iResolution;
        uniform float iTime;
        out vec4 fragColor;

        // --- 封装噪声函数开始 (Ian McEwan / Ashima Arts) ---
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

        float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = inversesqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        float prng(in vec2 seed) {
            seed = fract(seed * vec2(5.3983, 5.4427));
            seed += dot(seed.yx, seed.xy + vec2(21.5351, 14.3137));
            return fract(seed.x * seed.y * 95.4337);
        }

        float noiseStack(vec3 pos, int octaves, float falloff) {
            float noise = snoise(pos);
            float off = 1.0;
            for(int i=1; i<4; i++) {
                if(i >= octaves) break;
                pos *= 2.0;
                off *= falloff;
                noise = (1.0-off)*noise + off*snoise(pos);
            }
            return (1.0+noise)/2.0;
        }

        vec2 noiseStackUV(vec3 pos, int octaves, float falloff, float diff) {
            float displaceA = noiseStack(pos, octaves, falloff);
            float displaceB = noiseStack(pos + vec3(3984.293, 423.21, 5235.19), octaves, falloff);
            return vec2(displaceA, displaceB);
        }

        void mainImage(out vec4 fragColor, vec2 fragCoord) {
            float time = iTime;
            vec2 res = iResolution.xy;

            // 去掉鼠标变量，将 offset 设为静态或基于时间缓慢移动
            vec2 offset = vec2(0.0);

            float xpart = fragCoord.x / res.x;
            float ypart = fragCoord.y / res.y;
            float clip = 210.0;
            float ypartClip = fragCoord.y / clip;
            float ypartClippedFalloff = clamp(2.0 - ypartClip, 0.0, 1.0);
            float ypartClipped = min(ypartClip, 1.0);
            float ypartClippedn = 1.0 - ypartClipped;
            float xfuel = 1.0 - abs(2.0 * xpart - 1.0);

            float timeSpeed = 0.5;
            float realTime = timeSpeed * time;

            // 使用 realTime 代替 offset.x 实现自动水平滚动（可选）
            vec2 coordScaled = 0.01 * fragCoord;
            vec3 position = vec3(coordScaled, 0.0) + vec3(1223.0, 6434.0, 8425.0);
            vec3 flow = vec3(4.1 * (0.5 - xpart) * pow(ypartClippedn, 4.0), -2.0 * xfuel * pow(ypartClippedn, 64.0), 0.0);
            vec3 timing = realTime * vec3(0.0, -1.7, 1.1) + flow;

            vec3 displacePos = vec3(1.0, 0.5, 1.0) * 2.4 * position + realTime * vec3(0.01, -0.7, 1.3);
            vec3 displace3 = vec3(noiseStackUV(displacePos, 2, 0.4, 0.1), 0.0);

            vec3 noiseCoord = (vec3(2.0, 1.0, 1.0) * position + timing + 0.4 * displace3);
            float noise = noiseStack(noiseCoord, 3, 0.4);

            float flames = pow(ypartClipped, 0.3 * xfuel) * pow(noise, 0.3 * xfuel);
            float f = ypartClippedFalloff * pow(1.0 - flames * flames * flames, 8.0);
            float fff = f * f * f;
            vec3 fire = 1.5 * vec3(f, fff, fff * fff);

            // smoke
            float smokeNoise = 0.5 + snoise(0.4 * position + timing * vec3(1.0, 1.0, 0.2)) / 2.0;
            vec3 smoke = vec3(0.3 * pow(xfuel, 3.0) * pow(ypart, 2.0) * (smokeNoise + 0.4 * (1.0 - noise)));

            // sparks
            float sparkGridSize = 30.0;
            vec2 sparkCoord = fragCoord - vec2(0.0, 190.0 * realTime);
            sparkCoord -= 30.0 * noiseStackUV(0.01 * vec3(sparkCoord, 30.0 * time), 1, 0.4, 0.1);
            sparkCoord += 100.0 * flow.xy;
            if (mod(sparkCoord.y / sparkGridSize, 2.0) < 1.0) sparkCoord.x += 0.5 * sparkGridSize;
            vec2 sparkGridIndex = floor(sparkCoord / sparkGridSize);
            float sparkRandom = prng(sparkGridIndex);
            float sparkLife = min(10.0 * (1.0 - min((sparkGridIndex.y + (190.0 * realTime / sparkGridSize)) / (24.0 - 20.0 * sparkRandom), 1.0)), 1.0);
            vec3 sparks = vec3(0.0);
            if (sparkLife > 0.0) {
                float sparkSize = xfuel * xfuel * sparkRandom * 0.08;
                float sparkRadians = 999.0 * sparkRandom * 6.2831 + 2.0 * time;
                vec2 sparkCircular = vec2(sin(sparkRadians), cos(sparkRadians));
                vec2 sparkOffset = (0.5 - sparkSize) * sparkGridSize * sparkCircular;
                vec2 sparkModulus = mod(sparkCoord + sparkOffset, sparkGridSize) - 0.5 * sparkGridSize;
                float sparkLength = length(sparkModulus);
                float sparksGray = max(0.0, 1.0 - sparkLength / (sparkSize * sparkGridSize));
                sparks = sparkLife * sparksGray * vec3(1.0, 0.3, 0.0);
            }

            fragColor = vec4(max(fire, sparks) + smoke, 1.0);
        }

        void main() {
            mainImage(fragColor, gl_FragCoord.xy);
        }
    </script>

    <script id="terrain2_fs" type="x-shader/x-fragment">
        #version 300 es
        precision highp float;

        uniform vec3 iResolution;
        uniform float iTime;
        out vec4 fragColor;

        #define QUALITY 2
        #define MAX_FAR 20000.
        #define ITER(x) 15-int(log(x*RES_FACTOR)*.693)
        #define MARCH_SURFACE .4
        #define MARCH_STEP .002
        #define MARCH_REF_SCALE 4.
        #define SHADOW_STEP 2.
        #define SEA_DEEP 500.

        #define PI 3.1415926
        #define SEA_MAX 1.25
        #define SURFACE_MAX 2000.
        #define SUN_COLOR vec3(.95, 0.96, 1.2)

        const vec2 WIND = vec2(-0.6, -1.5);

        vec3 LIGHT;
        vec3 BASE_COLOR;
        vec3 ATOM_COLOR;
        vec3 HLIT_COLOR;
        vec3 ENV_COLOR;
        float RES_FACTOR = 1.;

        // --- 工具函数 ---
        mat3 setCamera(in vec3 ro, in vec3 ta) {
            vec3 cw = normalize(ta-ro);
            vec3 cp = vec3(0, 1, 0);
            vec3 cu = normalize(cross(cw,cp));
            vec3 cv = normalize(cross(cu,cw));
            return mat3(cu, cv, cw);
        }

        float n2d(vec2 p) {
            vec2 i = floor(p); p -= i;
            p *= p*(3. - p*2.);
            return dot(mat2(fract(sin(mod(vec4(0, 1, 113, 114) + dot(i, vec2(1, 113)), 6.2831853))*43758.5453))*vec2(1. - p.y, p.y), vec2(1. - p.x, p.x));
        }

        float hill(in vec2 p, int iter) {
            float a = 0.0; float b = .52;
            for(int i=0; i<iter; i++) { a += b*n2d(p); b *= .52; p *= 2.; }
            return (a - .52) * 200.;
        }

        const mat2 m2 = mat2(0.8,-0.6,0.6,0.8);
        float mountain(in vec2 p, int iter) {
            float a = 0.0; float b = 1.0; float d = 0.;
            p.y += 200.;
            for(int i=0; i<iter; i++) {
                vec2 f2 = fract(p); float f = length(f2*(1.-f2));
                d += f*f*(3.0-2.0*f);
                a += b*n2d(p)/(1.5+d);
                b *= 0.5; p = m2*p*2.05;
            }
            return a * 1800.;
        }

        float ground(in vec2 pos, int iter) {
            float x = pos.x + sin(pos.y * 0.001) * 1000.;
            float a = 0.;
            if (x > 0.) a = mountain(pos * 0.0007, iter) * pow(smoothstep(0., 5000., x), 3.0);
            float h = smoothstep(5000., 0., x);
            if (h > 0.) a += hill(pos * 0.005, iter) * h + min((x + 1000.) * 0.001, 0.) * 10.;
            return a + x * 0.005;
        }

        vec3 calcNormal(in vec3 pos, int iter, float f) {
            vec2 eps = vec2(f, 0.0);
            return normalize(vec3(ground(pos.xz-eps.xy, iter) - ground(pos.xz+eps.xy, iter), 2.0*eps.x, ground(pos.xz-eps.yx, iter) - ground(pos.xz+eps.yx, iter)));
        }

        vec3 getThickness(vec3 rd) {
            #define earthRadius 6371000.
            float b = -rd.y * earthRadius;
            vec4 cns = earthRadius + vec4(8228., 1800., 30000., 38228.);
            vec4 z = sqrt(cns*cns + (b*b - earthRadius*earthRadius));
            return vec3(b + z.xy, z.w - z.z);
        }

        vec4 getSky(vec3 rd, float addDepth) {
            // 降低瑞利系数（原本 5.6e-6, 1.25e-5, 2.9e-5）
            #define rayleighCoefficient vec3(3.6e-6, 8.5e-6, 1.8e-5)
            #define mieCoefficient 12e-9 // 略微调低米氏散射，减少白蒙蒙的感觉

            const mat3 coeffs = mat3(rayleighCoefficient, vec3(mieCoefficient), (vec3(3.426, 8.298, .356) * 6e-7))/0.693147;
            vec3 thickness = getThickness(rd) + addDepth;
            float rdl = max(dot(rd, LIGHT), 0.0);

            vec3 rayleighScatter = (thickness.x * (0.4*rdl*rdl + 1.12)) * rayleighCoefficient;
            float g = 0.8 - LIGHT.y*0.15 - mieCoefficient*1500.;
            float phaseMie = (0.4 + LIGHT.y*0.1 + mieCoefficient*7000.)*(1.0 - g*g)*pow(g*g - (2.0*g*rdl - 1.0), -1.5);

            vec3 sunCoeff = coeffs*(getThickness(LIGHT) + addDepth);
            vec3 viewCoeff = coeffs*thickness;

            // 增加 1.2 乘数以增强透射对比度，减少模糊
            vec3 absorption = (exp2(-viewCoeff) - exp2(-sunCoeff))/((sunCoeff - viewCoeff)*0.8);

            return vec4(clamp(SUN_COLOR*(rayleighScatter + thickness.y*phaseMie*mieCoefficient)*absorption*(0.6 + LIGHT.y*0.3), 0., 1.), 1.0);
        }

        float softShadow(in vec3 ro, float start, float limit, float shadowStep, int iter) {
            float res = 1.;
            for (float t=start; t<limit; t*=shadowStep) {
                vec3 pos = ro + t*LIGHT;
                float h = pos.y - ground(pos.xz, iter);
                res = min(res, 16.0*h/t);
                if (res<0.001 || pos.y>SURFACE_MAX || pos.y<0.) break;
            }
            return clamp(res, 0., 1.0);
        }

        // --- 核心修改：山体材质（雪顶减半，增加植被） ---
        vec3 drawMountain(vec3 pos, vec3 rd, vec3 light, float resT, float sshLimit, float waterSsh) {
            float f = n2d(0.005*pos.xz);
            vec3 nor = calcNormal(pos, ITER(resT), 0.0004*resT*RES_FACTOR);

            // 基础岩石颜色
            vec3 col = mix(vec3(0.18, 0.13, 0.11), vec3(0.09, 0.08, 0.07), smoothstep(400.0, 600.0, pos.y + 100.0*f)) * 0.45;

            // 1. 增加植被 (Vegetation)
            // 在中低海拔 (200-1000) 且坡度较缓 (nor.y > 0.6) 的地方生长
            float vegMask = smoothstep(200.0, 700.0, pos.y + 150.0*f) * smoothstep(1200.0, 800.0, pos.y);
            vegMask *= smoothstep(0.5, 0.8, nor.y);
            vec3 vegColor = vec3(0.08, 0.12, 0.04) * (0.4 + 0.6*f); // 深绿色
            col = mix(col, vegColor, vegMask * 0.7);

            // 2. 雪顶减小一半 (Snow)
            // 原阈值是 700-1500，现抬高到 1200-1800，使雪只出现在极高处
            float h = smoothstep(1200.0, 1800.0, pos.y + 400.0*f);
            float s = h > 0. ? smoothstep(0.1, 0.9, h*smoothstep(1.0-0.5*h, 1.0-0.1*h, nor.y*(1.2+clamp(pos.y-1000.,0.,200.)/600.))) : 0.;
            col = mix(col, 0.25*vec3(0.7, 0.8, 0.9), s);

            float dif = clamp(dot(nor, light), 0., 1.);
            float ssh = clamp(softShadow(pos, clamp(resT*0.01,0.1,150.0), sshLimit, SHADOW_STEP, max(1,ITER(resT)-4)), 0., 1.);
            dif *= min(waterSsh, ssh);

            vec3 lin = 0.2*mix(0.8*vec3(0.1,0.2,0.1),vec3(0.7,0.9,1.5)*3.0,clamp(0.5 + 0.5*nor.y, 0.3, 1.0)) + 3.5*vec3(1.0,0.9,0.8)*dif*ENV_COLOR*(1.+s*4.) + 35.*vec3(1.1,1.0,0.9)*clamp(dot(normalize(vec3(-light.x,0.1,-light.z)),nor),0.,1.)*BASE_COLOR;
            return col*lin;
        }

        float raymarch(in vec3 ro, in vec3 rd, float scale, out int type) {
            for (float t = 1.; t < MAX_FAR;) {
                vec3 pos = ro + t*rd;
                if (scale == 1. && pos.y < -5.0) { type = 0; return t; } // 海平面基准略微下沉

                float y = ground(pos.xz, ITER(t));
                type = 1;

                if (scale == 1. && y < SEA_MAX) {
                    // 降低海浪振幅从 1.0+0.2 降到 0.4+0.1，且向下偏移 0.5
                    float sy = (n2d(pos.xz*.1+iTime*WIND) * 0.4 + n2d(pos.xz*.4-iTime*WIND)*0.1) - 0.5;

                    // 只有当陆地极低时才渲染海浪，减少岩石穿模
                    if (sy > y) { y = sy; type = 0; }
                }

                float h = pos.y - y;
                float d = t*MARCH_STEP*RES_FACTOR;
                if (h < d*MARCH_SURFACE) return t;
                t += max(d, h*MARCH_SURFACE)*scale;
            }
            return MAX_FAR;
        }

        vec3 drawSea(vec3 pos, vec3 rd, float resT) {
            vec2 eps = vec2(pow(resT*0.05, 2.7)*.0005*RES_FACTOR, 0.0);
            vec3 normal = normalize(vec3(n2d((pos.xz-eps.xy)*.1+iTime*WIND) - n2d((pos.xz+eps.xy)*.1+iTime*WIND), 2.0*eps.x, n2d((pos.xz-eps.yx)*.1+iTime*WIND) - n2d((pos.xz+eps.yx)*.1+iTime*WIND)));
            float fresnel = 0.02 + 0.98 * pow(1. - max(dot(-rd, normal), 0.), 5.);
            vec3 ref = normalize(reflect(rd, normal));
            int rt; float rRes = raymarch(pos, ref, MARCH_REF_SCALE, rt);
            vec3 fCol = (rRes < MAX_FAR) ? drawMountain(pos + rRes*ref, ref, LIGHT, rRes+resT, SURFACE_MAX/max(0.01, LIGHT.y), 2.0) : getSky(ref, 0.0).rgb;
            return mix(vec3(0.1, 0.2, 0.3) * max(dot(LIGHT, normal), 0.), fCol, fresnel);
        }

        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
            vec2 res = iResolution.xy;
            // 1. 完全对齐 terrain_fs 的 UV 坐标系
            vec2 uv = (fragCoord + fragCoord - res) / res.y;
            float sunScreenY = uv.y - 0.3; // terrain_fs 的偏移量

            float speed = 250.0;
            vec3 ro = vec3(5000.0, 2400.0, -iTime * speed);
            vec3 ta = ro + vec3(0.2, -0.15, -1.0);
            mat3 ca = setCamera(ro, ta);

            // ============================================================
            // --- 核心优化：采用圆柱投影保持广角且无畸变 ---
            // ============================================================

            // 1. 定义水平视场角（Radians）。
            // 1.047 弧度约为 60 度，接近原代码的镜头宽度。
            // 如果你想更宽，可以增加这个值（例如 1.57 代表 90 度）。
            const float HORIZONTAL_FOV = 1.047;

            // 2. 将屏幕 XY 坐标转换为弧度。
            // 将 (2.0*fragCoord-res)/res.y 的 X 分量映射到 FOV 范围内。
            vec2 screenParams = (2.0 * fragCoord - res) / res.y;

            // 水平角度 θ (theta)
            float theta = screenParams.x * (HORIZONTAL_FOV * 0.5);
            // 垂直焦距仍然保持 1.732 (或者你也可以将其转换为角度)
            float fy = 1.732;

            // 3. 构建在相机空间内的无畸变射线。
            // 这种方法让直线（尤其是水平面）在投影后依然保持直线。
            vec3 rd_camera_space = normalize(vec3(sin(theta), screenParams.y, cos(theta) * fy));

            // 4. 将射线转换到世界空间。
            vec3 rd = ca * rd_camera_space;

            RES_FACTOR = 3840. / iResolution.x;

            // 3. 修正太阳方向：在世界空间指向斜上方，确保它是光源
            LIGHT = normalize(vec3(0.5, 0.3, -1.0));

            // 渲染参数
            vec3 topSky = getSky(vec3(0, 1, 0), 0.).xyz;
            BASE_COLOR = mix(topSky, vec3(0.05, 0.066, 0.09), 0.3)*0.2;
            vec4 bSky = getSky(rd, 0.0);
            ATOM_COLOR = mix(bSky.rgb, vec3(1.0, 0.8, 0.75)*dot(bSky.rgb, vec3(0.38)), 0.5);
            ENV_COLOR = ATOM_COLOR / (ATOM_COLOR.r + 0.01);

            int type = -1;
            float resT = raymarch(ro, rd, 1.0, type);
            vec3 fCol;

            if (resT < MAX_FAR) {
                vec3 pos = ro + rd * resT;
                fCol = (type == 0) ? drawSea(pos, rd, resT) : drawMountain(pos, rd, LIGHT, resT, SURFACE_MAX/max(0.01, LIGHT.y), 2.0);
                //float fog = exp(-0.0000005 * resT);
                //fCol = mix(ATOM_COLOR, fCol, fog);
            } else {
                fCol = bSky.rgb;
            }

            // 4. 太阳特效：按照 terrain_fs 逻辑在屏幕坐标绘制
            // 太阳位置：x=0.4, y=0.25 (在 y-0.3 后的坐标系中)
            float sunDist = max(length(vec2(uv.x, sunScreenY) - vec2(0.4, 0.25)), 0.01);
            vec3 sunGlow = 0.005 * vec3(6.0, 2.0, 1.0) / sunDist; // 照搬 terrain_fs 的数值
            fCol += sunGlow * 1.5; // 增强发光感

            fCol = pow(clamp(fCol * 1.3, 0.0, 1.0), vec3(0.4545));
            fragColor = vec4(fCol, 1.0);
        }

        void main() {
            mainImage(fragColor, gl_FragCoord.xy);
        }
    </script>


    <script type="text/javascript">
        const canvas = document.querySelector("#glCanvas");
        const gl = canvas.getContext("webgl2");
        if (!gl) alert("WebGL 2.0 Not Supported");

        const SHADER_NAMES = ['terrain', 'ocean', 'desert', 'grass', 'moutain', 'cloud', 'fire', 'terrain2'];
        const UNIFORMS = { time: "iTime", res: "iResolution" };

        // --- 帧率统计变量 ---
        const fpsData = {
            lastTime: 0,
            frameCount: 0,
            nextUpdate: 1000, // 每 1000ms 更新一次显示
            currentFps: 0
        };

        function createShader(gl, type, id) {
            const shader = gl.createShader(type);
            const source = document.getElementById(id).text.trim();
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(`Shader [${id}] Error:`, gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        const vs = createShader(gl, gl.VERTEX_SHADER, 'vs');

        const shaderSystem = SHADER_NAMES.reduce((acc, name) => {
            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, createShader(gl, gl.FRAGMENT_SHADER, `${name}_fs`));
            gl.linkProgram(prog);

            acc[name] = {
                program: prog,
                locs: {
                    time: gl.getUniformLocation(prog, UNIFORMS.time),
                    res: gl.getUniformLocation(prog, UNIFORMS.res)
                }
            };
            return acc;
        }, {});

        let currentIndex = SHADER_NAMES.length - 1;
        let currentKey = SHADER_NAMES[currentIndex];

        const vertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        const fpsElem = document.querySelector("#fpsCounter");

        function bindPositionAttribute(program) {
            const posLoc = gl.getAttribLocation(program, "position");
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
        }

        bindPositionAttribute(shaderSystem[currentKey].program);

        function render(time) {
            // --- 计算帧率逻辑 ---
            fpsData.frameCount++;
            if (time > fpsData.nextUpdate) {
                // 计算过去一秒内的平均帧率
                fpsData.currentFps = Math.round((fpsData.frameCount * 1000) / (time - (fpsData.nextUpdate - 1000)));
                //console.log(`Current Shader: ${currentKey} | FPS: ${fpsData.currentFps}`);
                fpsElem.innerText = `FPS:${fpsData.currentFps}`;
                fpsData.frameCount = 0;
                fpsData.nextUpdate = time + 1000;
            }

            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }

            const { program, locs } = shaderSystem[currentKey];

            gl.useProgram(program);
            gl.uniform1f(locs.time, time * 0.001);
            gl.uniform3f(locs.res, canvas.width, canvas.height, 1.0);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }

        document.querySelector("#switchBtn").addEventListener("click", () => {
            currentIndex = (currentIndex + 1) % SHADER_NAMES.length;
            currentKey = SHADER_NAMES[currentIndex];
            bindPositionAttribute(shaderSystem[currentKey].program);
            console.log(`Switched to: ${currentKey}`);
        });

        requestAnimationFrame(render);
    </script>

    <script type="module">
        
        import bowser from 'https://esm.sh/bowser@2.11.0';

        const browserParser = bowser.getParser(window.navigator.userAgent);
        const osInfo = browserParser.getOS();
        const brInfo = browserParser.getBrowser();

        document.getElementById('os-v').innerText = osInfo.name ? `${osInfo.name} ${osInfo.versionName || osInfo.version || ''}` : "UNKNOWN";
        document.getElementById('br-v').innerText = brInfo.name ? `${brInfo.name} ${brInfo.version || ''}` : "UNKNOWN";
        document.getElementById('core-v').innerText = (navigator.hardwareConcurrency || "8") + " Cores";

        const getGPUInfo = () => {
            const debug = gl.getExtension("WEBGL_debug_renderer_info");
            if (!debug) return "Generic GPU";

            let raw = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);

            // 清理 ANGLE 壳、PCI ID、冗余符号
            let clean = raw.replace(/ANGLE \((.*)\)/, '$1')
                .replace(/0x[0-9A-Fa-f]{4,}/g, '')
                .replace(/Direct3D\d+|vs_\d+_\d+|ps_\d+_\d+|D3D\d+/g, '')
                .replace(/[()（）,]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            // 去重逻辑：处理 "NVIDIA NVIDIA GeForce" 这种情况
            const words = clean.split(' ');
            const uniqueWords = [...new Set(words)];
            return uniqueWords.join(' ');
        };
        document.getElementById('gpu-v').innerText = getGPUInfo();


        async function cpuTest() {
            const t0 = performance.now();
            let x = 0;
            for (let i = 0; i < 10000000; i++) {
                x += Math.sqrt(i);
            }
            const duration = performance.now() - t0;
            const K = 100;
            let score = 100 * Math.pow(K / (K + duration), 1.5);
            return Math.round(score);
        }

        async function gpuTest() {
            const t0 = performance.now();
            const { program, locs } = shaderSystem[currentKey];
            gl.useProgram(program);
            const frameCount = 100;
            for (let i = 0; i < frameCount; i++) {
                gl.uniform1f(locs.time,  0.001);
                gl.uniform3f(locs.res, canvas.width, canvas.height, 1.0);
                //gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                gl.finish();
            }
            const duration = performance.now() - t0;
            const avg = duration / frameCount;
            
            const K = 0.01;
            let score = 100 * Math.pow(K / (K + avg), 1.5);
            return Math.round(score);
        }

        async function performanceTest() {
            const container = document.getElementById('main-container');
            const circumference = 364.4;

            // 按钮点击瞬间复位
            container.classList.remove('is-active');
            document.getElementById('cpu-score').innerText = '--';
            document.getElementById('gpu-score').innerText = '--';

            // 强行重绘，确保 CSS 瞬时移除 transition
            void container.offsetWidth;

            const cpuScore = await cpuTest();
            const gpuScore = await gpuTest();

            // 计算 CSS 变量值
            const cOffset = circumference - (cpuScore / 100) * circumference;
            const gOffset = circumference - (gpuScore / 100) * circumference;

            // 传参给 CSS，不直接在 JS 里写动画
            document.getElementById('cpu-bar').style.setProperty('--offset', cOffset);
            document.getElementById('gpu-bar').style.setProperty('--offset', gOffset);

            // 激活 CSS 动画类
            container.classList.add('is-active');

            const animateValue = (id, start, end, duration) => {
                const obj = document.getElementById(id);
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    obj.innerHTML = Math.floor(progress * (end - start) + start);
                    if (progress < 1) window.requestAnimationFrame(step);
                };
                window.requestAnimationFrame(step);
            };

            animateValue("cpu-score", 0, cpuScore, 1500);
            animateValue("gpu-score", 0, gpuScore, 1500);
        }

        document.getElementById('runBtn').addEventListener('click', performanceTest);
    </script>
</body>
